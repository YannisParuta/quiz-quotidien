# Quiz Quotidien – intégration Home Assistant
#
# 1. Copier le bloc « rest: » dans configuration.yaml, puis redémarrer Home Assistant.
#    Les capteurs sont rafraîchis toutes les 15 minutes depuis https://www.quiz-quotidien.fr/api/stats
# 2. Ajouter la carte du dashboard (bloc « Carte Lovelace » plus bas) via
#    Modifier le tableau de bord → Ajouter une carte → Manuel.

rest:
  - resource: https://www.quiz-quotidien.fr/api/stats
    scan_interval: 900
    sensor:
      - name: "Quiz joueurs aujourd'hui"
        unique_id: quiz_quotidien_joueurs_jour
        value_template: "{{ value_json.today.visits }}"
        unit_of_measurement: "joueurs"
        state_class: measurement
        icon: mdi:account-group
      - name: "Quiz terminés aujourd'hui"
        unique_id: quiz_quotidien_termines_jour
        value_template: "{{ value_json.today.completions }}"
        unit_of_measurement: "quiz"
        state_class: measurement
        icon: mdi:check-circle
      - name: "Quiz score moyen aujourd'hui"
        unique_id: quiz_quotidien_score_moyen_jour
        value_template: "{{ value_json.today.averageScore if value_json.today.averageScore is not none else 'unknown' }}"
        unit_of_measurement: "/10"
        state_class: measurement
        icon: mdi:star
      - name: "Quiz partages aujourd'hui"
        unique_id: quiz_quotidien_partages_jour
        value_template: "{{ value_json.today.shares }}"
        state_class: measurement
        icon: mdi:share-variant
      - name: "Quiz joueurs 7 jours"
        unique_id: quiz_quotidien_joueurs_7j
        value_template: "{{ value_json.last7Days.visits }}"
        unit_of_measurement: "joueurs"
        icon: mdi:calendar-week
      - name: "Quiz joueurs 30 jours"
        unique_id: quiz_quotidien_joueurs_30j
        value_template: "{{ value_json.last30Days.visits }}"
        unit_of_measurement: "joueurs"
        icon: mdi:calendar-month
      - name: "Quiz questions en base"
        unique_id: quiz_quotidien_questions
        value_template: "{{ value_json.questions.count }}"
        unit_of_measurement: "questions"
        icon: mdi:database

