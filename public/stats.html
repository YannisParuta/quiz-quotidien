<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Quiz Quotidien – Statistiques</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <style>
        :root {
            color-scheme: light;
            --surface-0: #f3f2ee;
            --surface-1: #fcfcfb;
            --border: #e4e2dc;
            --text-primary: #0b0b0b;
            --text-secondary: #52514e;
            --text-muted: #77756f;
            --series-1: #2a78d6;
            --track: #dcdad4;
            --bad: #d03b3b;
        }
        @media (prefers-color-scheme: dark) {
            :root:where(:not([data-theme="light"])) {
                color-scheme: dark;
                --surface-0: #111110;
                --surface-1: #1a1a19;
                --border: #2e2e2c;
                --text-primary: #f0efec;
                --text-secondary: #c3c2b7;
                --text-muted: #9a998f;
                --series-1: #3987e5;
                --track: #3a3a37;
                --bad: #e66767;
            }
        }
        :root[data-theme="dark"] {
            color-scheme: dark;
            --surface-0: #111110;
            --surface-1: #1a1a19;
            --border: #2e2e2c;
            --text-primary: #f0efec;
            --text-secondary: #c3c2b7;
            --text-muted: #9a998f;
            --series-1: #3987e5;
            --track: #3a3a37;
            --bad: #e66767;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 16px;
            background: var(--surface-0);
            color: var(--text-primary);
            font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        main { max-width: 960px; margin: 0 auto; display: grid; gap: 12px; }
        header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; }
        h1 { font-size: 18px; margin: 0; font-weight: 600; }
        .updated { color: var(--text-muted); font-size: 12px; }
        .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
        .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
        .label { color: var(--text-secondary); font-size: 13px; }
        .value { font-size: 28px; font-weight: 600; margin-top: 2px; }
        .hero .value { font-size: 48px; line-height: 1.1; }
        .delta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
        .meter { height: 8px; background: var(--track); border-radius: 4px; margin-top: 10px; overflow: hidden; }
        .meter > div { height: 100%; background: var(--series-1); border-radius: 4px; }
        h2 { font-size: 14px; font-weight: 600; margin: 0 0 10px; }
        .chart { position: relative; }
        .chart svg { display: block; width: 100%; height: 160px; overflow: visible; }
        .chart .bar { fill: var(--series-1); pointer-events: none; }
        .chart .hit { fill: transparent; cursor: default; }
        .chart .hit:hover + .bar, .chart .bar.active { opacity: .8; }
        .chart .axis { fill: var(--text-muted); font-size: 11px; }
        .chart .grid-line { stroke: var(--border); stroke-width: 1; }
        .tooltip {
            position: absolute; pointer-events: none; transform: translate(-50%, -100%);
            background: var(--text-primary); color: var(--surface-1); padding: 6px 8px;
            border-radius: 6px; font-size: 12px; white-space: nowrap; display: none;
        }
        details { margin-top: 8px; color: var(--text-secondary); font-size: 13px; }
        table { border-collapse: collapse; margin-top: 6px; width: 100%; font-variant-numeric: tabular-nums; }
        th, td { text-align: right; padding: 3px 8px; border-bottom: 1px solid var(--border); }
        th:first-child, td:first-child { text-align: left; }
        .error { color: var(--bad); }
    </style>
</head>
<body>
    <main>
        <header>
            <h1>Quiz Quotidien – Statistiques</h1>
            <span class="updated" id="updated">Chargement…</span>
        </header>

        <section class="grid">
            <div class="card hero">
                <div class="label">Joueurs aujourd'hui</div>
                <div class="value" id="today-visits">–</div>
                <div class="delta" id="today-delta"></div>
            </div>
            <div class="card">
                <div class="label">Quiz terminés aujourd'hui</div>
                <div class="value" id="today-completions">–</div>
                <div class="delta" id="today-rate"></div>
            </div>
            <div class="card">
                <div class="label">Score moyen aujourd'hui</div>
                <div class="value" id="today-score">–</div>
                <div class="delta" id="week-score"></div>
            </div>
            <div class="card">
                <div class="label">Partages aujourd'hui</div>
                <div class="value" id="today-shares">–</div>
                <div class="delta" id="week-shares"></div>
            </div>
        </section>

        <section class="grid">
            <div class="card">
                <div class="label">Joueurs sur 7 jours</div>
                <div class="value" id="week-visits">–</div>
                <div class="delta" id="month-visits"></div>
            </div>
            <div class="card">
                <div class="label">Quiz terminés sur 7 jours</div>
                <div class="value" id="week-completions">–</div>
                <div class="delta" id="all-completions"></div>
            </div>
            <div class="card">
                <div class="label">Questions en base</div>
                <div class="value" id="questions">–</div>
                <div class="meter"><div id="questions-meter" style="width:0"></div></div>
                <div class="delta" id="questions-remaining"></div>
            </div>
        </section>

        <section class="card">
            <h2>Joueurs par jour (14 derniers jours)</h2>
            <div class="chart" id="chart">
                <svg id="chart-svg" role="img" aria-label="Joueurs par jour sur les 14 derniers jours"></svg>
                <div class="tooltip" id="tooltip"></div>
            </div>
            <details>
                <summary>Voir le tableau</summary>
                <table>
                    <thead><tr><th>Jour</th><th>Joueurs</th><th>Quiz terminés</th></tr></thead>
                    <tbody id="table"></tbody>
                </table>
            </details>
        </section>
    </main>

    <script>
        // ?theme=dark ou ?theme=light pour forcer le thème (ex. carte de domotique)
        const theme = new URLSearchParams(location.search).get('theme');
        if (theme === 'dark' || theme === 'light') document.documentElement.dataset.theme = theme;

        const $ = id => document.getElementById(id);
        const fmt = n => n === null || n === undefined ? '–' : n.toLocaleString('fr-FR');
        const dayLabel = iso => new Date(iso + 'T12:00:00').toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric' });

        function render(s) {
            const { today, yesterday, last7Days, last30Days, allTime, questions, history } = s;

            $('today-visits').textContent = fmt(today.visits);
            $('today-delta').textContent = `Hier : ${fmt(yesterday.visits)}`;

            $('today-completions').textContent = fmt(today.completions);
            $('today-rate').textContent = `${today.completionRate} % des joueurs`;
            $('today-score').textContent = today.averageScore === null ? '–' : `${today.averageScore.toLocaleString('fr-FR')}/10`;
            $('week-score').textContent = last7Days.averageScore === null ? '' : `${last7Days.averageScore.toLocaleString('fr-FR')}/10 sur 7 jours`;
            $('today-shares').textContent = fmt(today.shares);
            $('week-shares').textContent = `${fmt(last7Days.shares)} sur 7 jours`;

            $('week-visits').textContent = fmt(last7Days.visits);
            $('month-visits').textContent = `${fmt(last30Days.visits)} sur 30 jours`;
            $('week-completions').textContent = fmt(last7Days.completions);
            $('all-completions').textContent = `${fmt(allTime.completions)} depuis le début`;

            $('questions').textContent = fmt(questions.count);
            $('questions-meter').style.width = `${Math.min(100, questions.count / questions.target * 100)}%`;
            $('questions-remaining').textContent = questions.remaining
                ? `sur ${fmt(questions.target)} · encore ≈ ${fmt(Math.ceil(questions.remaining / 10))} jours`
                : `Base complète (${fmt(questions.target)})`;

            renderChart(history);
            $('table').innerHTML = history.slice().reverse().map(d =>
                `<tr><td>${dayLabel(d.date)}</td><td>${fmt(d.visits)}</td><td>${fmt(d.completions)}</td></tr>`).join('');

            $('updated').textContent = 'Mis à jour à ' + new Date(s.updatedAt).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
            $('updated').classList.remove('error');
        }

        function renderChart(history) {
            const svg = $('chart-svg');
            const W = svg.clientWidth || 600, H = 160, top = 8, bottom = 20, left = 28;
            const max = Math.max(1, ...history.map(d => d.visits));
            const step = Math.pow(10, Math.floor(Math.log10(max)));
            const ceil = Math.ceil(max / step) * step;
            const plotH = H - top - bottom, slot = (W - left) / history.length, barW = Math.max(4, slot - 6);
            const y = v => top + plotH - (v / ceil) * plotH;
            const every = Math.ceil(56 / slot);
            let out = '';
            for (const t of [0, ceil / 2, ceil]) {
                out += `<line class="grid-line" x1="${left}" x2="${W}" y1="${y(t)}" y2="${y(t)}"/>`;
                out += `<text class="axis" x="${left - 6}" y="${y(t) + 4}" text-anchor="end">${fmt(Math.round(t))}</text>`;
            }
            history.forEach((d, i) => {
                const x = left + i * slot + (slot - barW) / 2;
                const h = Math.max(0, y(0) - y(d.visits));
                const r = Math.min(4, h, barW / 2);
                // Barre arrondie en haut, ancrée à la ligne de base
                const path = h > 0
                    ? `M${x},${y(0)} V${y(0) - h + r} Q${x},${y(0) - h} ${x + r},${y(0) - h} H${x + barW - r} Q${x + barW},${y(0) - h} ${x + barW},${y(0) - h + r} V${y(0)} Z`
                    : '';
                out += `<rect class="hit" data-i="${i}" x="${left + i * slot}" y="${top}" width="${slot}" height="${plotH}"/>`;
                out += `<path class="bar" d="${path}"/>`;
                // Une date toutes les `every` barres selon la place, en partant d'aujourd'hui
                if ((history.length - 1 - i) % every === 0) {
                    out += `<text class="axis" x="${x + barW / 2}" y="${H - 4}" text-anchor="middle">${dayLabel(d.date)}</text>`;
                }
            });
            svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
            svg.innerHTML = out;

            const tip = $('tooltip');
            svg.querySelectorAll('.hit').forEach(el => {
                const d = history[+el.dataset.i];
                el.addEventListener('mouseenter', () => {
                    tip.innerHTML = `<strong>${dayLabel(d.date)}</strong><br>${fmt(d.visits)} joueurs · ${fmt(d.completions)} terminés`;
                    const bx = +el.getAttribute('x') + +el.getAttribute('width') / 2;
                    tip.style.display = 'block';
                    // Garde l'infobulle dans la carte, même sur la première et la dernière barre
                    const half = tip.offsetWidth / 2;
                    tip.style.left = `${Math.min(svg.clientWidth - half, Math.max(half, bx / W * svg.clientWidth))}px`;
                    tip.style.top = `${y(d.visits) / H * svg.clientHeight - 6}px`;
                });
                el.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
            });
        }

        let last;
        async function load() {
            try {
                const r = await fetch('/api/stats', { cache: 'no-store' });
                if (!r.ok) throw new Error('HTTP ' + r.status);
                last = await r.json();
                render(last);
            } catch (e) {
                $('updated').textContent = 'Erreur de chargement (' + e.message + ')';
                $('updated').classList.add('error');
            }
        }
        load();
        setInterval(load, 5 * 60 * 1000);
        addEventListener('resize', () => last && renderChart(last.history));
    </script>
</body>
</html>
